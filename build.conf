# steamos-build-installer — build configuration
# Copy and edit this file, then pass it with --config build.conf
#
# Usage:
#   sudo ./steamos-build.sh --action build --config build.conf
#   sudo ./steamos-build.sh --action flash --config build.conf --device /dev/sdX
#
# All settings below have sensible defaults. Uncomment and modify as needed.

# ── Image Settings ────────────────────────────────────────────────────────────

# Source image path (plain .img or compressed .img.bz2/.gz/.xz/.zst)
# Required for build action.
# IMG="/path/to/steamdeck-repair-image.img.bz2"

# Root partition size in MiB (Valve default: 5120 = 5 GiB)
# ROOTFS_SIZE="10240"

# Output directory for the finished image (leave empty for same dir as source)
# OUTPUT_DIR="/home/image"

# Expected final image size in bytes (hard build assertion; leave empty to skip)
# If set, the build will abort if the published image does not match exactly.
# EXPECTED_IMAGE_SIZE="13488881664"

# ── Update Strategy ──────────────────────────────────────────────────────────

# Update strategy after driver installation:
#   selfheal — OS updates work; driver is rebuilt automatically (recommended)
#   hold     — OS updates blocked (Steam always shows "up to date")
#   stock    — OS updates work but REMOVE the driver
# UPDATE_MODE="selfheal"

# OOBE variant: derived from neutralize-oobe in system tweaks
#   neutralize-oobe checked   → steamdeck      (suppresses first-boot flow)
#   neutralize-oobe unchecked → steamdeck-oobe  (keeps first-boot flow)
# TARGET_VARIANT="steamdeck"

# Update branch: stable | beta | preview | rc | bc | pc | main
# UPDATE_BRANCH="stable"

# ── Session & UI ─────────────────────────────────────────────────────────────

# Default login session:
#   desktop — Plasma desktop
#   game    — Gamescope gaming mode (default)
#   desktop — Plasma desktop mode
# DEFAULT_SESSION="game"

# ── Build Options ────────────────────────────────────────────────────────────

# Include one-click installer desktop icon (1=yes, 0=no)
# ADD_INSTALLER=1

# Build extra hardware support: firmware, fingerprint, etc. (1=yes, 0=no)
# BUILD_HW_SUPPORT=1

# Hardware support items (space-separated):
#   linux-firmware libfprint fprintd bolt dkms
# HW_SUPPORT_ITEMS="linux-firmware libfprint fprintd bolt dkms"

# Kernel modules to force into initramfs for early boot (space-separated)
# Leave empty for stock initramfs
# INITRAMFS_MODULES=""

# Install Python applications via pipx (1=yes, 0=no)
# INSTALL_PIPX=0

# Pipx packages to install (space-separated)
# PIPX_ITEMS=""

# ── Build Environment ────────────────────────────────────────────────────────

# Working directory (leave empty to auto-detect)
# WORKDIR=""

# Build location: auto | ram | disk
#   auto — prefer RAM if free >= 3x image size, otherwise disk
#   ram  — force /dev/shm (fast, needs lots of RAM)
#   disk — force disk (slower, works with less RAM)
# WORKDIR_LOCATION="auto"

# ── Flash Options ────────────────────────────────────────────────────────────

# Target device for flash action (e.g., /dev/sda)
# Required for flash action.
# TARGET_DEV=""

# Confirm destructive flash operation (1=yes, 0=no)
# Required for flash action.
# FLASH_CONFIRMED=0

# Allow flashing to the disk the host is running from (1=yes, 0=no)
# ALLOW_SYSTEM_DISK=0

# ── Customizations ───────────────────────────────────────────────────────────
#
# Optimization items are configured in lib/configs/customizations.conf
# Edit that file to enable/disable specific optimizations.
#
# Items marked "always" are applied unconditionally.
# Items marked TRUE/FALSE are shown in the GUI and can be toggled.
