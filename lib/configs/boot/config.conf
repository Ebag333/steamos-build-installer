# steam-perf boot configuration
# Managed by steamos-build-installer.  Each hook reads only the
# variables it understands.

# CPU governor + energy performance preference
CPU_GOVERNOR=performance
CPU_EPP=performance

# GPU power limit: "max" = raise to card ceiling, or a specific wattage
GPU_POWER_LIMIT=max

# vm.swappiness: applied by the one-shot sysctl.d drop-in, not by boot hooks.
# Listed here for reference only.
# VM_SWAPPINESS_ZRAM=180
# VM_SWAPPINESS_DISK=10

# sched_ext scheduler (requires scx-scheds package)
# SCX_SCHEDULER=scx_lavd
# SCX_MODE=autopilot
