NAME=logitech-hid
DESCRIPTION="Logitech receiver and HID++ kernel modules (upstream)"

# Direct install mode — builds out-of-tree kernel modules and installs them
# directly into the target.  No PKGBUILD, no .pkg.tar.zst artifact.
INSTALL_CMD=/tmp/build/sources/build-hid.sh
INSTALL_ARGS=master

BUILD_DEPS=(
    make
    gcc
)
