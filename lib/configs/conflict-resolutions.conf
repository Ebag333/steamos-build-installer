# steamos-build-installer — known package conflict resolutions
#
# Defines how to handle package conflicts detected during pacman upgrades.
# Used by the pre-flight dry-run check before system_upgrade() and
# pacman_upgrade_all().
#
# Format: ACTION|old_package|new_package|file_path|reason
#
# ACTION:
#   uninstall  — remove old_package before running the upgrade (pacman -Rdd)
#   overwrite  — pass --overwrite for file_path to the upgrade transaction
#   skip       — log the conflict but take no action (manual intervention)
#
# Lines starting with # are comments; blank lines are skipped.
# Wildcards are NOT supported — use exact package/file names.

# ── Package renames ──────────────────────────────────────────────────────────
# When a package is renamed in the repos (e.g. drm_info → drm-info), the old
# package must be removed before the new one can install.

uninstall|drm_info|drm-info|/usr/bin/drm_info|Package renamed in repos (drm_info → drm-info)
