# steamos-build-installer customizations
# Format: module|item|default|description
# Lines starting with # are comments
#
# These customizations are applied via the optimization system.
# Items marked TRUE/FALSE are shown in the GUI and controlled by user selection.

# Video/GPU optimizations
Video|unset-libva-driver|TRUE|Remove /etc/profile.d/libva.sh — stops forcing LIBVA_DRIVER_NAME=radeonsi so browser auto-detects VA-API driver
Video|resize-bar|TRUE|nvidia.NVreg_EnableResizableBAR=1 — enable resizable BAR for NVIDIA GPU
Video|gpu-power-limit|TRUE|Raise discrete GPU power limit to vendor ceiling on every boot

# CPU/Performance optimizations (always applied)
Performance|cpu-performance|FALSE|Hard set CPU governor + EPP to performance on every boot (recommended to use gamemode)
Performance|scx-lavd|TRUE|Enable scx_lavd scheduler (autopilot) — best frametime consistency, requires scx-scheds package
Performance|vm-tunables|TRUE|Tune vm.swappiness for zram (180) or disk swap (10) — SteamOS ships zram at default 60

# System optimizations (always applied)
System|gamemode|TRUE|Add deck user to gamemode group — allows CPU performance mode switching
System|disable-autologin|TRUE|Disable automatic login — require password at boot (sets Relogin=false in sddm.conf)

# OOBE optimizations
OOBE|neutralize-oobe|TRUE|Neutralize destructive OOBE Steam reset in steam-jupiter — prevents data wipe on first boot

# PCI/Hardware optimizations
PCI|pci-realloc|TRUE|pci=realloc=on — fix firmware PCI bridge resource allocation
PCI|tb-host-reset|TRUE|thunderbolt.host_reset=0 — improve Thunderbolt/eGPU hotplug stability
PCI|thunderbolt|TRUE|Thunderbolt dock support: PCI rescan udev rule + bolt service enable

# Build-time optimizations (optional - shown in GUI)
Build|trim-cuda|FALSE|Remove CUDA/OpenCL/NVVM/OptiX libraries (~350 MB) — not needed for gaming, required for AI models
Build|fix-keyring|TRUE|Force initialize Arch + holo pacman keyrings
Build|skip-sigcheck|FALSE|Disable pacman signature checks in build chroot (recommended to fix-keyring instead)
Build|debug-boot|FALSE|Add rd.debug rd.log=all to kernel cmdline for boot debugging
