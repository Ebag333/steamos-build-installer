# steamos-nvidia-installer — build defaults
# Single source of truth for all build flag defaults.
# Sourced by steamos-nvidia.sh at startup.  CLI args and --config override.
# If this file is missing, all flags initialize to blank/zero.

# Update strategy: selfheal | hold | stock
UPDATE_MODE="selfheal"

# Include one-click installer desktop icon (1=yes, 0=no)
ADD_INSTALLER=1

# Trim CUDA/OpenCL/NVVM/OptiX libs to save ~350 MB (1=yes, 0=no)
TRIM_CUDA=0

# Build extra hardware support (1=yes, 0=no)
BUILD_HW_SUPPORT=1

# Hardware support items (space-separated)
# linux-firmware libfprint fprintd bolt dkms
HW_SUPPORT_ITEMS="linux-firmware libfprint fprintd bolt dkms"

# Install Thunderbolt dock support (1=yes, 0=no)
THUNDERBOLT=0

# Add rd.debug rd.log=all to kernel cmdline for boot debugging (1=yes, 0=no)
DEBUG_BOOT=0

# Login session mode: desktop | game | "" (stock)
DEFAULT_SESSION="game"

# Root partition size in MiB (Valve default: 5120 = 5 GiB, empty = default)
ROOTFS_SIZE=""

# Work directory (empty = auto-detect)
WORKDIR=""

# Build location: auto | ram | disk
WORKDIR_LOCATION="auto"

# Disable pacman signature checks in build chroot (1=yes, 0=no)
SKIP_SIG=0

# Force-initialise pacman keyring (1=yes, 0=no)
FIX_KEYRING=0

# Initramfs modules (space-separated, empty = stock)
INITRAMFS_MODULES=""

# Gaming items (space-separated)
# All items now handled by optimization system
GAMING_ITEMS=""

# Allow flashing to the disk the host is running from (1=yes, 0=no)
ALLOW_SYSTEM_DISK=0
