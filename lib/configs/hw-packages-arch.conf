# steamos-build-installer hardware packages
# Format: group|package|version|default|description
# Lines starting with # are comments
# Pulled from official Arch repositories.
# NOTE: linux-firmware-neptune-jupiter must be removed first (it conflicts
# with the full linux-firmware).  install_hw_libs() handles this.

# Firmware drivers
Firmware|linux-firmware|latest|TRUE|Full firmware suite (replaces Valve's Deck subset for generic HW)
Firmware|linux-firmware-liquidio|latest|FALSE|Cavium LiquidIO server adapter firmware
Firmware|linux-firmware-marvell|latest|TRUE|Marvell network adapter firmware
Firmware|linux-firmware-mellanox|latest|FALSE|Mellanox Spectrum switch firmware
Firmware|linux-firmware-nfp|latest|FALSE|Netronome Flow Processor firmware
Firmware|linux-firmware-qcom|latest|FALSE|Qualcomm SoC firmware
Firmware|linux-firmware-qlogic|latest|FALSE|QLogic networked device firmware

# NVIDIA drivers
NVIDIA|nvidia-open-dkms|latest|TRUE|NVIDIA open kernel module sources for DKMS
NVIDIA|nvidia-utils|latest|TRUE|NVIDIA userspace driver libraries and tools
NVIDIA|lib32-nvidia-utils|latest|TRUE|32-bit NVIDIA userspace libraries

# Video acceleration
Video|libva-nvidia-driver|latest|TRUE|NVIDIA VA-API driver
