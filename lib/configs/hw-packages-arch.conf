# steamos-build-installer hardware packages
# Format: group|package|version|default|description
# Lines starting with # are comments
# Pulled from official Arch repositories.

# Firmware bundle
Firmware - Bundle|linux-firmware|latest|TRUE|Arch default Linux firmware set (includes broad support for the most common firmware packages)

# CPU microcode
Firmware - CPU|intel-ucode|latest|FALSE|CPU microcode updates for Intel processors
Firmware - CPU|amd-ucode|latest|FALSE|CPU microcode updates for AMD processors

# GPU firmware
Firmware - GPU|linux-firmware-amdgpu|latest|FALSE|Firmware for modern AMD GPUs
Firmware - GPU|linux-firmware-radeon|latest|FALSE|Firmware for legacy AMD Radeon GPUs
Firmware - GPU|linux-firmware-nvidia|latest|FALSE|Firmware for NVIDIA GPUs

# General/vendor device firmware
Firmware - Device|linux-firmware-intel|latest|FALSE|Firmware for Intel devices (GPU, Chip, Network, etc)
Firmware - Device|linux-firmware-atheros|latest|FALSE|Firmware for Qualcomm Atheros devices
Firmware - Device|linux-firmware-broadcom|latest|FALSE|Firmware for Broadcom devices
Firmware - Device|linux-firmware-cirrus|latest|FALSE|Firmware for Cirrus Logic devices
Firmware - Device|linux-firmware-marvell|latest|FALSE|Firmware for Marvell devices
Firmware - Device|linux-firmware-mediatek|latest|FALSE|Firmware for MediaTek devices
Firmware - Device|linux-firmware-qcom|latest|FALSE|Firmware for Qualcomm devices
Firmware - Device|linux-firmware-realtek|latest|FALSE|Firmware for Realtek devices

# Specialized/server firmware
Firmware - Specialized|linux-firmware-liquidio|latest|FALSE|Firmware for Cavium LiquidIO server adapters
Firmware - Specialized|linux-firmware-mellanox|latest|FALSE|Firmware for Mellanox Spectrum switches
Firmware - Specialized|linux-firmware-nfp|latest|FALSE|Firmware for Netronome Flow Processors
Firmware - Specialized|linux-firmware-qlogic|latest|FALSE|Firmware for QLogic devices

# Miscellaneous firmware
Firmware - Other|linux-firmware-other|latest|TRUE|Firmware not assigned to another vendor package (recommended, unlikely to auto-detect)

# NVIDIA drivers
Nvidia|nvidia-open-dkms|latest|FALSE|NVIDIA open kernel module sources for DKMS
Nvidia|nvidia-utils|latest|FALSE|NVIDIA userspace driver libraries and tools
Nvidia|lib32-nvidia-utils|latest|FALSE|32-bit NVIDIA userspace libraries
Nvidia|libva-nvidia-driver|latest|FALSE|NVIDIA VA-API driver using NVDEC

# Nouveau / NVK
Nouveau|vulkan-nouveau|latest|FALSE|[EXPERIMENTAL] Open-source NVK Vulkan driver for NVIDIA GPUs (https://wiki.archlinux.org/title/Nouveau)
Nouveau|lib32-vulkan-nouveau|latest|FALSE|[EXPERIMENTAL] 32-bit open-source NVK Vulkan driver for NVIDIA GPUs (https://wiki.archlinux.org/title/Nouveau)

# Intel drivers
Intel|intel-gmmlib|latest|FALSE|Intel graphics memory-management library
Intel|intel-media-driver|latest|FALSE|Intel VA-API media driver (iHD) for modern Intel GPUs
Intel|vulkan-intel|latest|FALSE|Intel Vulkan driver
Intel|lib32-vulkan-intel|latest|FALSE|32-bit Intel Vulkan driver

# AMD drivers
AMD|mesa|latest|FALSE|Open-source OpenGL and VA-API drivers for AMD GPUs
AMD|lib32-mesa|latest|FALSE|32-bit OpenGL drivers for AMD GPUs
AMD|vulkan-radeon|latest|FALSE|RADV Vulkan driver for AMD GPUs
AMD|lib32-vulkan-radeon|latest|FALSE|32-bit RADV Vulkan driver for AMD GPUs

# Generic VA-API
Video|libva|latest|TRUE|VA-API runtime for hardware video acceleration
Video|lib32-libva|latest|TRUE|32-bit VA-API runtime for Steam and 32-bit applications
Video|libva-utils|latest|TRUE|VA-API diagnostic tools including vainfo
