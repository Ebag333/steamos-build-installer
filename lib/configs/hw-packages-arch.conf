# steamos-nvidia-installer hardware packages
# Format: package|version|description
# Lines starting with # are comments
# Pulled from official Arch repositories.
# NOTE: linux-firmware-neptune-jupiter must be removed first (it conflicts
# with the full linux-firmware).  install_hw_libs() handles this.

# Firmware drivers
linux-firmware|latest|Full firmware suite (replaces Valve's Deck subset for generic HW)
linux-firmware-liquidio|latest|Cavium LiquidIO server adapters,
linux-firmware-marvell|latest|Marvell network adapters,
linux-firmware-mellanox|latest|Mellanox Spectrum switches,
linux-firmware-nfp|latest|Netronome Flow Processors,
linux-firmware-qcom|latest|Qualcomm SoCs,
linux-firmware-qlogic|latest|QLogic networked devices.

# nvidia drivers
nvidia-open-dkms|latest|NVIDIA open kernel module sources for DKMS
nvidia-utils|latest|NVIDIA userspace driver libraries and tools
lib32-nvidia-utils|latest|32-bit NVIDIA userspace libraries
