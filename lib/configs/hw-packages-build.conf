# steamos-nvidia-installer — hardware packages build configuration
# Defines which custom packages to build and install.
#
# Format: TYPE|NAME|VERSION|DEFAULT|DESCRIPTION
# Lines starting with # are comments
#
# TYPE: kernel-module, flatpak
# VERSION: Git ref (commit, tag, branch) or "latest"
# DEFAULT: TRUE = build by default, FALSE = optional

# ── Kernel Modules ───────────────────────────────────────────────────────────

# Logitech HID: Upstream Logitech receiver and HID++ kernel modules
# Replaces stock kernel modules with newer versions for better device support
kernel-module|logitech-hid|5841e54418d3fa2201753773dc79f2b3b8968675|TRUE|Logitech receiver and HID++ kernel modules (upstream module for modern Logitech mice/keyboards)

# AoTofu VA-API: AoTofu nvidia-vaapi-driver for VA-API video acceleration
# Provides hardware-accelerated video decoding for browsers and media players
kernel-module|aotofu-vaapi|latest|FALSE|AoTofu nvidia-vaapi-driver for VA-API support (hardware acceleration for browsers and media players)

# ── Flatpak Packages ─────────────────────────────────────────────────────────

# DLSS Updater: Automatically updates DLSS DLLs for NVIDIA GPUs
# Downloads latest release from GitHub and installs as user flatpak
flatpak|dlss-updater|latest|TRUE|DLSS Updater for NVIDIA GPUs (automatically updates DLSS DLLs)
