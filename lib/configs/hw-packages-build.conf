# steamos-build-installer — hardware packages build configuration
# Defines which custom packages to build and install.
#
# Format: TYPE|NAME|VERSION|DEFAULT|DESCRIPTION|RECIPE
# Lines starting with # are comments
#
# TYPE: kernel-module, flatpak
# VERSION: Git ref (commit, tag, branch) or "latest"
# DEFAULT: TRUE = build by default, FALSE = optional
# RECIPE: Directory name under lib/configs/build_recipes/ (for kernel-module builds)

# ── Kernel Modules ───────────────────────────────────────────────────────────

# Logitech HID: Upstream Logitech receiver and HID++ kernel modules
# Replaces stock kernel modules with newer versions for better device support
kernel-module|logitech-hid|5841e54418d3fa2201753773dc79f2b3b8968675|FALSE|Logitech receiver and HID++ kernel modules (upstream module for modern Logitech mice/keyboards)|logitech-hid

# ── Flatpak Packages ─────────────────────────────────────────────────────────

# DLSS Updater: Automatically updates DLSS DLLs for NVIDIA GPUs
# Downloads latest release from GitHub and installs as user flatpak
flatpak|Recol/DLSS-Updater|latest|FALSE|DLSS Updater for NVIDIA GPUs (automatically updates DLSS DLLs)|dlss-updater
