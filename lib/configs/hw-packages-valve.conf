# steamos-build-installer hardware packages
# Format: group|package|version|default|description
# Lines starting with # are comments
# NOTE: Pulled from Valve's pacman repository

# Drivers
Biometric|libfprint|latest|TRUE|Fingerprint reader library
Biometric|fprintd|latest|TRUE|Fingerprint reader daemon
Thunderbolt|bolt|latest|TRUE|Thunderbolt device manager
Video|intel-gmmlib|latest|TRUE|Intel graphics memory-management library
Video|intel-media-driver|latest|TRUE|Intel VA-API media driver (iHD) for modern Intel GPUs
Video|libva-utils|latest|TRUE|Vendor-neutral VA-API utilities
Build|dkms|latest|TRUE|DKMS build system for building modules (used for drivers such as nvidia)

# Gaming related packages
Gaming|mangohud|latest|TRUE|Vulkan/OpenGL overlay for monitoring performance
Gaming|lib32-mangohud|latest|TRUE|32-bit MangoHud for Steam games
Gaming|vulkan-tools|latest|TRUE|Vulkan utilities (vkcube, vulkaninfo)

# Common development packages
Dev|git|latest|TRUE|Version control system
Dev|python-pipx|latest|TRUE|Install Python applications in isolated environments (required for all pipx installs)
Dev|qt6-base|latest|TRUE|Base graphical interface binaries used by many python applications

# System related packages
System|irqbalance|latest|TRUE|Used to manage IRQ and balance across cores

# Installer runtime dependencies (yad pulls in webkit2gtk, harfbuzz-icu, etc.)
Installer|yad|latest|TRUE|GUI dialog toolkit for the installer frontend
Installer|pv|latest|TRUE|Pipe viewer for progress display during builds
