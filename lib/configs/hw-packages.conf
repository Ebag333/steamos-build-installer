# ── Remote Desktop ───────────────────────────────────────────────────────────

# Chrome Remote Desktop: Google Remote Desktop host
# Built from Google's .deb via vendored AUR PKGBUILD (build-recipe type for build_recipe framework)
# VERSION: "latest" to build whatever pkgver is in the PKGBUILD, or
#          "pkgver-sha256" to pin (e.g. "152.0.7977.9-fc6e10808f589a04...").
#          The sha256 is for the .deb source entry in the PKGBUILD.
build-recipe|Remote|chrome-remote-desktop|latest|FALSE|Google Remote Desktop host (remote access via Chrome/browser)|chrome-remote-desktop

