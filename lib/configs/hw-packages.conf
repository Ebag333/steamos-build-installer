# steamos-build-installer — hardware packages
# Unified manifest for all package types.
#
# Format: TYPE|group|package|version|default|description|recipe
# Lines starting with # are comments; blank lines are skipped.
#
# TYPE:
#   pacman         — pacman package (from image's configured repos)
#   build-recipe  — package built from source via PKGBUILD (recipe required)
#   flatpak        — flatpak application (recipe required)
#
# VERSION: "latest" or a pinned version
# DEFAULT: TRUE = install by default, FALSE = optional
# RECIPE:  Directory name under lib/configs/build_recipes/ (only for build-recipe/flatpak)

# ── System & Runtime ─────────────────────────────────────────────────────────

pacman|Build|dkms|latest|TRUE|DKMS build system for building modules (used for drivers such as nvidia)|
pacman|System|irqbalance|latest|TRUE|Used to manage IRQ and balance across cores|

