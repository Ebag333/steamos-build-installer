# steamos-build-installer — initramfs configuration
# Defines which kernel modules to include in the initramfs for early boot.
#
# Format: GROUP|MODULES|DEFAULT|DESCRIPTION
# Lines starting with # are comments
#
# Groups:
#   base     — NVIDIA core modules (always needed for GPU)
#   storage  — Storage controllers (NVMe, AHCI, etc.)
#   display  — Display/GPU modules (optional - loads later is fine)
#   input    — Input devices (keyboard, mouse)
#   usb      — USB controllers
#   network  — Network adapters
#
# MODULES is a space-separated list of kernel module names.
# DEFAULT: TRUE = included by default, FALSE = optional

# ── NVIDIA Core ──────────────────────────────────────────────────────────────
# NVIDIA modules required for GPU support
display|nvidia nvidia_modeset nvidia_drm nvidia_uvm|FALSE|NVIDIA GPU driver modules

# ── Storage Controllers ──────────────────────────────────────────────────────
# NVMe and SATA/AHCI for disk access during boot
storage|nvme ahci sd_mod|TRUE|NVMe and SATA storage controllers
storage|btrfs|TRUE|Btrfs filesystem support

# ── Display/GPU ──────────────────────────────────────────────────────────────
# Intel integrated GPU (optional - can load after root mount)
display|i915 xe|FALSE|Intel integrated GPU drivers

# ── Input Devices ────────────────────────────────────────────────────────────
# USB HID for keyboard/mouse during early boot
input|usbhid hid_generic|TRUE|USB HID input devices

# ── USB Controllers ──────────────────────────────────────────────────────────
# USB host controller for peripherals
usb|xhci_hcd|TRUE|USB 3.0 host controller
usb|typec|TRUE|USB Type-C support

# ── Thunderbolt ──────────────────────────────────────────────────────────────
# Thunderbolt support for eGPU and docks
usb|thunderbolt|TRUE|Thunderbolt controller

# ── Network ──────────────────────────────────────────────────────────────────
# Network adapters for early boot (NFS root, remote unlock, etc.)
network|iwlwifi|TRUE|Intel WiFi adapter
network|igc|TRUE|Intel Gigabit Ethernet
