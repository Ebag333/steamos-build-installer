[options]
RootDir = /
DBPath = /usr/lib/holo/pacmandb/
CacheDir = /var/cache/pacman/pkg/
HookDir = /etc/pacman.d/hooks/
GPGDir = /etc/pacman.d/gnupg/
LogFile = /var/log/pacman.log

HoldPkg = pacman
HoldPkg = glibc

Architecture = x86_64
Color
CheckSpace
ParallelDownloads = 10
CleanMethod = KeepInstalled

SigLevel = PackageRequired
SigLevel = PackageTrustedOnly
SigLevel = DatabaseOptional
SigLevel = DatabaseTrustedOnly
LocalFileSigLevel = PackageOptional
LocalFileSigLevel = PackageTrustedOnly


###############################################################################
# Valve platform overrides — highest priority
###############################################################################

[jupiter-3.8.1x]
Usage = All
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-3.8.1x/os/x86_64

[holo-3.8.1x]
Usage = All
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/holo-3.8.1x/os/x86_64


###############################################################################
# Current upstream Arch — preferred for normal packages
###############################################################################

[core]
Usage = All
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Usage = All
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Usage = All
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch


###############################################################################
# Valve snapshot fallback — lowest priority
#
# Used only when a package is unavailable from jupiter/holo/current Arch.
###############################################################################

[core-3.8.1x]
Usage = All
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/core-3.8.1x/os/x86_64

[extra-3.8.1x]
Usage = All
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/extra-3.8.1x/os/x86_64

[multilib-3.8.1x]
Usage = All
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/multilib-3.8.1x/os/x86_64
