# steamos-build-installer — known virtual provider resolutions
#
# Defines preferred providers for ambiguous virtual dependencies.
# Used by the pre-flight check to avoid interactive provider selection prompts.
#
# Format: VIRTUAL|preferred_package|reason
#
# Lines starting with # are comments; blank lines are skipped.

# Tesseract OCR language data — English is the sensible default for SteamOS
tessdata|tesseract-data-eng|English OCR model (SteamOS default)
