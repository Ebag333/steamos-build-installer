# steamos-build live configuration
# Copy and edit this file, then pass it with --config live.conf
#
# Usage:
#   sudo ./steamos-build.sh --action live --config live.conf
#
# Space-separated list of actions to apply to the running system.

# Available actions:
#   resize            Expand root filesystems to fill partitions
#   thunderbolt       Configure Thunderbolt dock and hotplug support
#   desktop           Set Desktop Mode as default
#   gamemode          Add deck user to gamemode group
#   disable-autologin Disable automatic login
#   scx-lavd          Enable scx_lavd scheduler (autopilot)
#   vm-tunables       Tune vm.swappiness for zram/disk swap
#   cpu-performance   Set CPU governor to performance
#   gpu-power-limit   Raise GPU power limit to vendor ceiling
#   initramfs         Configure initramfs modules
#   logitech-hid      Build Logitech HID++ kernel modules
#   keyring           Fix pacman keyring
#   password          Set user password
#   cleanup           Clean pacman cache, temp files, journal

LIVE_ACTIONS="resize thunderbolt desktop gamemode disable-autologin scx-lavd vm-tunables cpu-performance gpu-power-limit keyring cleanup"
