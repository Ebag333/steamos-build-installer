NAME=nvidia-vaapi-driver
DESCRIPTION="NVIDIA VA-API driver (AoTofu fork)"

SOURCE_TYPE=tarball
SOURCE_URL=https://github.com/elFarto/nvidia-vaapi-driver/archive/refs/tags/v0.0.17.tar.gz
SOURCE_DIR=nvidia-vaapi-driver-0.0.17

INSTALL_CMD=./install.sh
INSTALL_ARGS="--clean --no-chrome-integration"

RUNTIME_DEPS=(
    libva
    libdrm
    libglvnd
    gst-plugins-bad-libs
)

BUILD_DEPS=(
    meson
    ninja
    pkgconf
    ffnvcodec-headers
)

# Packages that must NEVER come from Arch repos (recipe-specific ABI-critical).
# Added to the base denied list in repository.sh.
ARCH_FALLBACK_DENIED_EXTRA=(
    libdrm
    libva
    libglvnd
    mesa
    llvm-libs
    vulkan-icd-loader
    vulkan-tools
    gst-plugins-bad-libs
    gstreamer
)

# ABI-critical packages to track versions for (recipe-specific).
# Added to the base critical list in engine.sh.
ABI_CRITICAL_PKGS=(
    libdrm
    libva
    libglvnd
    mesa
    llvm-libs
    gst-plugins-bad-libs
    gstreamer
    vulkan-icd-loader
    vulkan-tools
)

# Diagnostic checks specific to this recipe
DIAG_PC_FILES=(
    egl.pc
    libva.pc
    libdrm.pc
    gstreamer-codecparsers-1.0.pc
)

DIAG_PKGS=(
    glibc
    gcc
    libglvnd
    libva
    libdrm
    gst-plugins-bad-libs
    ffnvcodec-headers
)
