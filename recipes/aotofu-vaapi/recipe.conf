NAME=aotofu-vaapi
DESCRIPTION="AoTofu NVIDIA VA-API driver"

SOURCE_TYPE=git
SOURCE_URL=https://github.com/AoTofu/nvidia-vaapi-driver.git
SOURCE_REF=main

RUNTIME_DEPS=(
    libva
    libdrm
    libglvnd
    gst-plugins-bad-libs
)

BUILD_DEPS=(
    meson
    ninja
    pkgconf
    ffnvcodec-headers
)

VERIFY_COMMANDS=(
    "pkg-config --exists egl"
    "pkg-config --exists libva"
    "pkg-config --exists libdrm"
    "pkg-config --exists gstreamer-codecparsers-1.0"
)

ARTIFACT_TYPE=pacman
